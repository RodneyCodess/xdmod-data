version: 2.1

executors:
  min-python:
    machine:
      image: ubuntu-2004:2024.11.1
    environment:
      PYTHON_VERSION: "3.8"
  max-python:
    machine:
      image: ubuntu-2604:2026.05.1
    environment:
      PYTHON_VERSION: "3.14"

jobs:
  build_xdmod_images:
    parameters:
      xdmod_version:
        type: string
    environment:
      XDMOD_VERSION: << parameters.xdmod_version >>
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Build XDMoD web server images
          command: ./tests/ci/scripts/build_xdmod_img.sh
      - persist_to_workspace:
          root: .
          paths:
            - << parameters.xdmod_version >>.tar
  run_tests:
    parameters:
      xdmod_version:
        type: string
      python_version:
        type: string
    environment:
      XDMOD_VERSION: << parameters.xdmod_version >>
    executor: << parameters.python_version >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests against XDMoD web server image
          command: ./tests/ci/scripts/run_tests.sh
      - persist_to_workspace:
          root: .
          paths:
            - .coverage.*
  coverage_report:
    parameters:
      python_version:
        type: string
    executor: << parameters.python_version >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Generate coverage report
          command: ./tests/ci/scripts/generate_coverage_report.sh

workflows:
  workflow:
    jobs:
      - build_xdmod_images:
          matrix:
            parameters:
              xdmod_version: ["xdmod-main-dev", "xdmod-11-0-dev", "xdmod-11-0"]
      - run_tests:
          requires:
            - build_xdmod_images
          matrix:
            parameters:
              xdmod_version: ["xdmod-main-dev", "xdmod-11-0-dev", "xdmod-11-0"]
              python_version: ["min-python", "max-python"]
      - coverage_report:
          requires:
            - run_tests
          matrix:
            parameters:
              python_version: ["min-python", "max-python"]