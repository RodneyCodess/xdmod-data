version: 2.1
parameters:
  min_python_version:
    type: string
    default: "3.8"
  max_python_version:
    type: string
    default: "3.14"

executors:
  min-python:
    machine:
      image: ubuntu-2004:2024.11.1
    environment:
      PYTHON_VERSION: << pipeline.parameters.min_python_version >>
  max-python:
    machine:
      image: ubuntu-2604:2026.05.1
    environment:
      PYTHON_VERSION: << pipeline.parameters.max_python_version >>
  min-python-docker:
    docker:
      - image: cimg/python:<< pipeline.parameters.min_python_version >>
    environment:
      PYTHON_VERSION: << pipeline.parameters.min_python_version >>
  max-python-docker:
    docker:
      - image: cimg/python:<< pipeline.parameters.max_python_version >>
    environment:
      PYTHON_VERSION: << pipeline.parameters.max_python_version >>

jobs:
  build_xdmod_images:
    parameters:
      xdmod_version:
        type: string
    environment:
      XDMOD_VERSION: << parameters.xdmod_version >>
      BASE_IMAGE: "tools-ext-01.ccr.xdmod.org/xdmod:x86_64-rockylinux8.9.20231119-v11.0.0-1.0-03"
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build XDMoD web server images
          command: ./tests/ci/scripts/build_xdmod_img.sh
      - persist_to_workspace:
          root: .
          paths:
            - << parameters.xdmod_version >>.tar
  run_tests:
    parameters:
      xdmod_version:
        type: string
      executor:
        type: string
    environment:
      XDMOD_VERSION: << parameters.xdmod_version >>
      MIN_PYTHON_VERSION: << pipeline.parameters.min_python_version >>
    executor: << parameters.executor >>
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests against XDMoD web server image
          command: ./tests/ci/scripts/run_tests.sh
      - persist_to_workspace:
          root: .
          paths:
            - .coverage.*
  coverage_report:
    parameters:
      executor:
        type: string
    executor: << parameters.executor >>
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Generate coverage report
          command: ./tests/ci/scripts/generate_coverage_report.sh
  lint:
    docker:
      - image: cimg/python:<< pipeline.parameters.max_python_version >>
    resource_class: small
    steps:
      - checkout
      - run:
          name: Lint
          command: |
            python3 -m pip install --upgrade flake8 flake8-commas flake8-quotes
            python3 -m flake8 . --max-complexity=10 --max-line-length=160 --show-source --exclude __init__.py

workflows:
  build_and_test:
    jobs:
      - build_xdmod_images:
          matrix:
            parameters:
              xdmod_version: ["xdmod-main-dev", "xdmod-11-0-dev", "xdmod-11-0"]
      - run_tests:
          requires:
            - build_xdmod_images
          matrix:
            parameters:
              xdmod_version: ["xdmod-main-dev", "xdmod-11-0-dev", "xdmod-11-0"]
              executor: ["min-python", "max-python"]
      - coverage_report:
          requires:
            - run_tests
          matrix:
            parameters:
              executor: ["min-python-docker", "max-python-docker"]
  lint:
    jobs:
      - lint
